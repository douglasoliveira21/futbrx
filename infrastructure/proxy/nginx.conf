server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 resolver 127.0.0.11 valid=10s ipv6=off;
 set $api_backend http://api:8080;
 client_max_body_size 2m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'" always;
 location /api/ { proxy_pass $api_backend; proxy_set_header Host $host; proxy_connect_timeout 10s; proxy_read_timeout 300s; }
 location /hubs/ { proxy_pass $api_backend; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 3600s; }
 location ~* "^/assets/.*-[a-zA-Z0-9_-]{8,}\.(js|css)$" { expires 1y; add_header Cache-Control "public, immutable"; }
 location /assets/ { expires 1d; }
 location / { try_files $uri $uri/ /index.html; }
}
