# Use este arquivo sozinho no serviço Compose do EasyPanel.
# Domínio/HTTPS são configurados no painel: web, porta interna 80, protocolo HTTP.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: brasileirao
      POSTGRES_USER: manager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Preencha POSTGRES_PASSWORD no ambiente do EasyPanel}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manager -d brasileirao"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Jwt__Key: ${JWT_KEY:?Preencha JWT_KEY com pelo menos 32 caracteres aleatórios}
      ConnectionStrings__Game: Host=db;Port=5432;Database=brasileirao;Username=manager;Password=${POSTGRES_PASSWORD}
      Database__Migrate: "true"
      Admin__UserIds: ${ADMIN_USER_IDS:-}
      # Entrar com Google (ID do cliente OAuth, não é segredo) e e-mail de contato mostrado nas páginas de privacidade e termos.
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Legal__ContactEmail: ${LEGAL_CONTACT_EMAIL:-}
      # Recuperação de senha por e-mail: endereço público do jogo e servidor SMTP. Sem eles o link "Esqueceu sua senha?" só orienta.
      App__PublicUrl: ${APP_PUBLIC_URL:-}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Web.Dockerfile
    depends_on:
      api:
        condition: service_started
    healthcheck:
      # Testa Nginx, proxy e API após migrações e carga inicial.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 24
    restart: unless-stopped

volumes:
  postgres-data:
