services:
 api:
  environment:
   ASPNETCORE_ENVIRONMENT: Production
 caddy:
  image: caddy:2-alpine
  ports: ["80:80", "443:443"]
  environment:
   DOMAIN: ${DOMAIN:?Defina o domínio com DNS apontando para este servidor}
  volumes:
   - ./infrastructure/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
   - caddy-data:/data
   - caddy-config:/config
  depends_on: [web]
  restart: unless-stopped
volumes:
 caddy-data:
 caddy-config:
