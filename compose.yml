services:
 db:
  image: postgres:17-alpine
  environment:
   POSTGRES_DB: brasileirao
   POSTGRES_USER: manager
   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
  volumes: ["postgres-data:/var/lib/postgresql/data"]
  healthcheck:
   test: ["CMD-SHELL", "pg_isready -U manager -d brasileirao"]
   interval: 5s
   timeout: 5s
   retries: 20
 api:
  build:
   context: .
   dockerfile: infrastructure/docker/Api.Dockerfile
  environment:
   ASPNETCORE_ENVIRONMENT: Development
   Jwt__Key: ${JWT_KEY:?Defina JWT_KEY com pelo menos 32 caracteres}
   ConnectionStrings__Game: Host=db;Database=brasileirao;Username=manager;Password=${POSTGRES_PASSWORD}
   Database__Migrate: "true"
   Admin__UserIds: ${ADMIN_USER_IDS:-}
   Google__ClientId: ${GOOGLE_CLIENT_ID:-}
   Legal__ContactEmail: ${LEGAL_CONTACT_EMAIL:-}
  depends_on:
   db: {condition: service_healthy}
  restart: unless-stopped
 web:
  build:
   context: .
   dockerfile: infrastructure/docker/Web.Dockerfile
  ports: ["127.0.0.1:8080:80"]
  depends_on: [api]
  restart: unless-stopped
volumes:
 postgres-data:
